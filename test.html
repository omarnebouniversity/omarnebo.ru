<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кто во мне главный</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f0e0c'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23e8c64f' stroke-width='7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column — intro, one question per screen with three big answer buttons, result with three bars */
:root{--bg:#F6F2EA;--surface:#FFFFFF;--ink:#1B2340;--muted:#565D7A;--line:#E2DACB;--p:#2B6CB0;--a:#2F855A;--c:#D9601A;--on:#FFFFFF;--display:'Unbounded',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11162A;--surface:#1B2240;--ink:#F2EEE6;--muted:#A9AFC8;--line:#2E365C;--p:#5B9BE0;--a:#4CC27F;--c:#F08A4B;--on:#11162A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11162A;--surface:#1B2240;--ink:#F2EEE6;--muted:#A9AFC8;--line:#2E365C;--p:#5B9BE0;--a:#4CC27F;--c:#F08A4B;--on:#11162A;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font:800 clamp(30px,8vw,42px)/1.08 var(--display);margin:0;text-wrap:balance}
h2{font:600 clamp(20px,5vw,24px)/1.3 var(--display);margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--p)}.dots i:nth-child(2){background:var(--a)}.dots i:nth-child(3){background:var(--c)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar span{display:block;height:100%;background:var(--ink);transition:width .3s}
.count{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;min-height:56px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:500 17px/1.35 var(--body);cursor:pointer;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--ink)}.opt:active{transform:scale(.98)}
.btn{min-height:54px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font:600 18px var(--body);cursor:pointer;padding:0 24px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.zone{border-radius:20px;padding:22px;color:var(--on);display:flex;flex-direction:column;gap:6px;animation:pop .45s ease}
.zone small{font-size:14px;opacity:.9;text-transform:uppercase;letter-spacing:.06em}
.zone b{font:800 clamp(32px,9vw,44px)/1.05 var(--display)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.res{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-direction:column;gap:6px}
.row .top{display:flex;justify-content:space-between;font-weight:600}
.row .top b{font:800 20px var(--display);font-variant-numeric:tabular-nums}
.track{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:7px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
const S={p:{n:'Родитель',v:'--p',d:'Правила, забота, ценности, ответственность. Сильный Родитель умеет поддержать и держать границы, слабый — с трудом говорит «нет» и заботится о себе.'},
a:{n:'Взрослый',v:'--a',d:'Факты, вопросы, решения. Сильный Взрослый спокойно думает и выбирает, слабый — реагирует импульсивно или живёт по чужим правилам.'},
c:{n:'Дитя',v:'--c',d:'Энергия, желания, радость, творчество. Сильное Дитя умеет хотеть и играть, слабое — живёт в «надо» и забывает, чего хочет само.'}};
const Q=[
['Друг опоздал на 30 минут.',[['p','«Сколько можно, опять!»'],['a','«Что случилось? Давай решим, как успеть»'],['c','Обижаюсь и молчу']]],
['Выходной без планов.',[['c','Спонтанно еду куда-нибудь'],['p','Разбираю дела, которые давно надо сделать'],['a','Смотрю, на что есть силы и что важнее, и решаю']]],
['Коллега ошибся в общем проекте.',[['a','Разбираю причину и предлагаю, как исправить'],['p','Объясняю, как надо было сделать правильно'],['c','Расстраиваюсь или раздражаюсь']]],
['Понравилась дорогая вещь.',[['c','Покупаю, раз хочется'],['p','«Нельзя тратить на ерунду»'],['a','Смотрю бюджет и решаю']]],
['Близкий человек плачет.',[['p','Обнимаю, утешаю, говорю, что всё будет хорошо'],['a','Спрашиваю, что случилось и чем помочь'],['c','Сам расстраиваюсь и теряюсь']]],
['Предложили новое дело, в котором вы ничего не понимаете.',[['c','«Интересно, хочу попробовать!»'],['a','Собираю информацию и считаю риски'],['p','«Сначала надо как следует научиться»']]],
['Что вы чаще всего говорите себе?',[['p','«Ты должен»'],['c','«Хочу»'],['a','«Что сейчас важнее?»']]],
['Вас несправедливо критикуют.',[['p','Объясняю, кто прав и как надо'],['c','Обижаюсь или вспыхиваю'],['a','Уточняю, что именно не так, и решаю, согласен ли']]],
['На вечеринке вы…',[['c','Танцую и дурачусь'],['p','Слежу, чтобы всем было хорошо'],['a','Общаюсь и ухожу, когда запланировал']]],
['Нужно принять важное решение.',[['p','Как принято или как советуют старшие'],['c','Как чувствую'],['a','Взвешиваю за и против']]],
['Друг третий раз просит в долг.',[['p','«Ты мне ещё прошлый не вернул»'],['c','Неудобно отказать, даю'],['a','Спрашиваю, сколько и когда вернёт, и решаю']]],
['Вы заболели.',[['p','«Нельзя расслабляться», иду на работу'],['c','Хочу, чтобы меня жалели, лежу с сериалами'],['a','Оцениваю состояние, иду к врачу, переношу дела']]]];
let i=0,score={p:0,a:0,c:0},order=[];
const app=document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function intro(){app.innerHTML=`<div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><h1>Кто во мне главный?</h1><p class="lead">12 ситуаций. Выбирайте не как правильно, а как вы <b>обычно</b> поступаете. Займёт 2–3 минуты.</p><p class="lead">В конце вы увидите, какое эго-состояние у вас сильнее всего, а какое — ваша зона роста.</p><button class="btn" id="go">Начать тест</button>`;document.getElementById('go').onclick=()=>{i=0;score={p:0,a:0,c:0};order=Q.map(q=>shuffle(q[1]));ask()}}
function ask(){const q=Q[i];app.innerHTML=`<div class="count">Вопрос ${i+1} из ${Q.length}</div><div class="bar"><span style="width:${i/Q.length*100}%"></span></div><h2>${q[0]}</h2><div class="opts">${order[i].map((o,k)=>`<button class="opt" data-k="${o[0]}">${o[1]}</button>`).join('')}</div>${i?'<button class="btn ghost" id="back">Назад</button>':''}`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{order[i].pick=b.dataset.k;score[b.dataset.k]++;i++;i<Q.length?ask():result()});
 const bk=document.getElementById('back');if(bk)bk.onclick=()=>{i--;score[order[i].pick]--;ask()};app.querySelector('.opt').focus({preventScroll:true});scrollTo(0,0)}
function pct(){const t=Q.length,raw=Object.entries(score).map(([k,v])=>({k,x:v*100/t,f:Math.floor(v*100/t)}));let left=100-raw.reduce((a,r)=>a+r.f,0);raw.sort((a,b)=>(b.x-b.f)-(a.x-a.f)).forEach(r=>{if(left>0){r.f++;left--}});const o={};raw.forEach(r=>o[r.k]=r.f);return o}
function result(){const P=pct(),ks=['p','a','c'],min=Math.min(...ks.map(k=>score[k])),max=Math.max(...ks.map(k=>score[k]));
 const low=ks.filter(k=>score[k]===min),high=ks.filter(k=>score[k]===max),z=low[0];
 app.innerHTML=`<div class="zone" style="background:var(${S[z].v})"><small>Ваша зона роста</small><b>${low.map(k=>S[k].n).join(' / ')}</b><span>${low.length>1?'Ничья: выберите сами, что качать.':'Скажите ведущему это слово.'}</span></div>
 <div class="res">${['p','a','c'].map(k=>`<div class="row"><div class="top"><span>${S[k].n}</span><b>${P[k]}%</b></div><div class="track"><div class="fill" data-w="${P[k]}" style="background:var(${S[k].v})"></div></div></div>`).join('')}</div>
 <div class="card"><p><b>Сильнее всего:</b> ${high.map(k=>S[k].n).join(' и ')}.</p></div>
 ${low.map(k=>`<div class="card"><b>${S[k].n}</b><p>${S[k].d}</p></div>`).join('')}
 <p class="lead">Это не диагноз, а зеркало. Нам нужны все трое: Дитя даёт энергию, Родитель — опору, Взрослый — решения.</p>
 <button class="btn ghost" id="again">Пройти заново</button>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%')));
 document.getElementById('again').onclick=intro;scrollTo(0,0)}
intro();
</script>
</body>
</html>
